name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Swift tests
        run: swift test
      - name: Swift tests (release, optimized)
        run: swift test -c release -Xswiftc -enable-testing
      - name: Root script tests
        run: scripts/test-root.sh
      - name: App string catalog coverage
        run: scripts/check-l10n.sh
      - name: Release signing script (dry run, throwaway key, no network)
        run: scripts/test-sign-release.sh
      - name: DMG build (packaging + xcstringstool)
        run: scripts/build-dmg.sh
      - name: Bash syntax check
        run: |
          for f in Resources/root/mvpn Resources/root/ovpn-dns scripts/*.sh; do
            bash -n "$f"
          done
