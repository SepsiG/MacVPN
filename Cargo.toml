[workspace]
resolver = "3"
members = ["crates/core", "crates/platform-mac", "crates/mvpn", "crates/app-core", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
