[workspace]
resolver = "3"
members = ["crates/core", "crates/platform-api", "crates/platform-mac", "crates/platform-win", "crates/winsys", "crates/helper", "crates/app-core", "app/src-tauri", "examples/macvpn-control-client"]

[workspace.package]
version = "2.0.3"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Argon2id with the vault's production parameters (64 MiB, t = 32) takes about 12 s unoptimized; optimized in test
# and dev builds too, so the tests that must use them stay fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
