# Hand-written peer config for a pfSense WireGuard tunnel (pfSense has no client export)
[Interface]
PrivateKey = FakepfSenseClientNotARealKey000000000000000=
Address = 10.20.32.2/32, fd00:db8:20:32::2/128
DNS = 10.20.30.1, 2001:db8:30::53, corp.example.com, example.com
MTU = 1420

[Peer]
PublicKey = FakepfSenseServerNotARealKey000000000000000=
PresharedKey = FakepfSensePresharedNotARealKey000000000000=
AllowedIPs = 10.20.32.0/24, 10.20.30.0/24, 192.0.2.0/24, fd00:db8:20:32::/64, 2001:db8:30::/48
Endpoint = vpn.example.com:51820
