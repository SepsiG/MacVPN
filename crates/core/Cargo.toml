[package]
name = "macvpn-core"
description = "MacVPN platform-independent logic: models, storage, validators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "macvpn_core"

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
idna = "1.1.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
uuid = { version = "1.26.1", features = ["v4"] }
# The encrypted vault (behind the `vault` feature; versions pinned by the spike,
# docs/superpowers/spikes/2026-10-19-vault-spike.md). No getrandom: randomness comes from `vault::Entropy`.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
zeroize = "1.9.1"

# The `O_*` and errno constants of `fsx`'s Unix side (no libc function is called: core has no `unsafe`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# SQLCipher 4 with the CommonCrypto provider (chosen by libsqlite3-sys when no OPENSSL_* variable is set; the
# release gate in scripts/build-dmg.sh checks it).
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher"], optional = true }

# Windows: SQLCipher 4 with a vendored OpenSSL (docs/superpowers/spikes/2026-10-20-windows-check-spike.md, decision
# B), so the vault compiles and its tests run on Windows CI. It puts openssl-src and openssl-sys into Cargo.lock, but
# resolver 3 never activates them for a macOS target: `cargo tree --target <macOS target> -i openssl-sys` prints
# nothing, and the release gate in scripts/build-dmg.sh checks that the app links no OpenSSL. Linux comes later.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }

[features]
# The vault code (key hierarchy, database). Only the app side (app-core, platform-mac) enables it; the root layer
# (mvpn) never does, and the release gate in scripts/build-dmg.sh checks that mvpn links no SQLite.
vault = ["dep:argon2", "dep:chacha20poly1305", "dep:rusqlite"]
# Test-only helpers (the cheap `KdfParams::insecure_for_tests`). Enabled only by this crate's own dev-dependency on
# itself, never by a production crate.
test-support = []

[[test]]
name = "vault_keys"
required-features = ["vault"]

[[test]]
name = "vault_keystore"
required-features = ["vault"]

[[test]]
name = "vault_db"
required-features = ["vault"]

[[test]]
name = "vault_connections"
required-features = ["vault"]

[[test]]
name = "vault_misc"
required-features = ["vault"]

[[test]]
name = "vault_tree"
required-features = ["vault"]

[[test]]
name = "vault_backup"
required-features = ["vault"]

[[test]]
name = "vault_credentials"
required-features = ["vault"]

[[test]]
name = "catalog_keys"
required-features = ["vault"]

[[test]]
name = "catalog_payload"
required-features = ["vault"]

[[test]]
name = "catalog_format"
required-features = ["vault"]

[[test]]
name = "catalog_source"
required-features = ["vault"]

[[test]]
name = "catalog_subscription"
required-features = ["vault"]

[[test]]
name = "vault_catalog"
required-features = ["vault"]

[[test]]
name = "catalog_planner"
required-features = ["vault"]

[[test]]
name = "vault_catalog_apply"
required-features = ["vault"]

[[test]]
name = "catalog_publish"
required-features = ["vault"]

[[test]]
name = "catalog_admin_file"
required-features = ["vault"]

[dev-dependencies]
macvpn-core = { path = ".", features = ["test-support"] }
plist = "1.10.1"
