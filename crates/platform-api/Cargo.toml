[package]
name = "macvpn-platform-api"
description = "MacVPN platform layer interface: the traits every platform implements, the shared types and the product identity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "macvpn_platform_api"

[lints]
workspace = true

[dependencies]
# `vault` for the re-exported `KeyStore`, `Entropy` and `LegacyKeychain`.
macvpn-core = { path = "../core", features = ["vault"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = "1.9.1"
