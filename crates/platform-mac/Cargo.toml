[package]
name = "macvpn-platform-mac"
description = "MacVPN macOS-specific services (Keychain, native VPN, login item, installers)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "macvpn_platform_mac"

[dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
libc = "0.2.191"
macvpn-core = { path = "../core" }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
oslog = { version = "0.2.0", default-features = false }
plist = "1.10.1"
regex = "1.13.1"
security-framework-sys = "2.17.0"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = "3.0.0"
