[package]
name = "macvpn-platform-mac"
description = "MacVPN macOS-specific services (Keychain, native VPN, login item, installers)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "macvpn_platform_mac"
# No doc tests. rustdoc compiles the crate with `debug_assertions` even in `cargo test --release`, while
# platform-api is the release build there, so the debug-only smoke hooks would not resolve.
doctest = false

[dependencies]
libc = "0.2.191"
macvpn-core = { path = "../core", features = ["vault"] }
macvpn-platform-api = { path = "../platform-api" }
regex = "1.13.1"
serde_json = "1.0.154"
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = "1.9.1"

# The whole crate is macOS-only (`#![cfg(target_os = "macos")]`): another target sees an empty crate and needs none
# of the Apple frameworks' bindings.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAppearance",
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-quartz-core",
] }
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
objc2-service-management = "0.3.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
oslog = { version = "0.2.0", default-features = false }
plist = "1.10.1"
security-framework-sys = "2.17.0"

[features]
# Test-only API (`KeychainKeyStore::in_keychain`, `CurlCatalogFetcher::with_test_ca`); enabled only by this crate's
# own dev-dependency on itself.
test-support = ["macvpn-platform-api/test-support"]

[lints]
workspace = true

[dev-dependencies]
macvpn-platform-mac = { path = ".", features = ["test-support"] }
ed25519-dalek = "3.0.0"
