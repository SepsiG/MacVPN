# The lab's charon settings (server side).
charon {
  load_modular = yes
  # macOS' Cisco IPsec client uses IKEv1 Aggressive Mode with a PSK (its group name is the KeyID). Aggressive
  # Mode PSK is weak (the PSK hash can be cracked offline); acceptable for a throwaway lab only.
  i_dont_care_about_security_and_use_aggressive_mode_psk = yes
  # Cisco Unity attributes: split-include networks and the DNS for the Cisco IPsec client.
  cisco_unity = yes
  # A server: never install the clients' routes or virtual IPs here.
  install_routes = no
  install_virtual_ip = no
  plugins {
    include strongswan.d/charon/*.conf
    # bypass-lan would exempt the container's own subnet (Docker's edge network, where every client appears to
    # come from) from IPsec: L2TP's transport-mode replies would leave unencrypted and the clients drop them.
    bypass-lan {
      load = no
    }
  }
  filelog {
    stdout {
      default = 1
      ike = 1
      cfg = 1
      time_format = %H:%M:%S
    }
  }
}
include strongswan.d/*.conf
