; L2TP (inside IPsec only: ipsec.sh drops plain UDP 1701). PPP addresses 10.99.16.0/24.
[global]
port = 1701

[lns default]
ip range = 10.99.16.10-10.99.16.200
local ip = 10.99.16.1
refuse pap = yes
refuse chap = yes
require authentication = yes
name = macvpn-lab
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes
